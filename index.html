<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="releese">
    <title>releese</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%232C1458'/%3E%3Crect x='4' y='4' width='8' height='8' fill='%232ee6a8'/%3E%3C/svg%3E">
    <link rel="preload" href="assets/pexico.otf" as="font" type="font/otf" crossorigin>
    <style>
        @font-face {
            font-family: 'Pexico';
            src: url('assets/pexico.otf') format('opentype');
            font-display: swap;
        }

        :root {
            --purple: #2C1458;
            --pink: #6B0F67;
            --blue: #1D477D;
            --teal: #2ee6a8;
            --magenta: #e039c0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            background: #0d0118;
            font-family: 'Pexico', monospace;
            color: #fff;
        }

        /* --- background --- */
        .bg {
            position: fixed;
            inset: 0;
            background: url('assets/background.png') center / cover no-repeat;
            image-rendering: pixelated;
        }

        .vignette {
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at center, transparent 50%, rgba(8, 0, 18, 0.6) 100%);
            pointer-events: none;
        }

        /* --- hero --- */
        .hero {
            position: relative;
            height: 100%;
            display: grid;
            place-items: center;
        }

        h1 {
            font-weight: 400;
            font-size: clamp(3.5rem, 15vw, 10rem);
            letter-spacing: 0.05em;
            text-shadow:
                0 0 18px rgba(224, 57, 192, 0.45),
                0 0 70px rgba(107, 15, 103, 0.65);
        }

        .cursor {
            display: inline-block;
            width: 0.5ch;
            height: 0.85em;
            margin-left: 0.1em;
            background: #fff;
            transform: translateY(0.06em);
            animation: blink 1.1s steps(1) infinite;
        }

        @keyframes blink { 50% { opacity: 0; } }

        /* --- github link --- */
        .gh {
            position: fixed;
            bottom: 4.5vh;
            left: 50%;
            transform: translateX(-50%);
            display: inline-flex;
            align-items: center;
            gap: 0.65em;
            padding: 0.7em 1.35em;
            font-size: clamp(0.95rem, 2.4vh, 1.2rem);
            letter-spacing: 0.08em;
            color: #fff;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.22);
            border-radius: 6px;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            transition: background 0.2s ease, transform 0.2s ease;
        }

        .gh:hover {
            background: rgba(255, 255, 255, 0.22);
            transform: translateX(-50%) translateY(-2px);
        }

        .gh svg {
            width: 1.4em;
            height: 1.4em;
            fill: #fff;
        }

        /* --- entrance --- */
        .hero h1, .gh {
            opacity: 0;
            translate: 0 14px;
            transition: opacity 0.7s ease, translate 0.7s ease;
        }

        body.loaded .hero h1 { opacity: 1; translate: 0 0; transition-delay: 0.15s; }
        body.loaded .gh { opacity: 1; translate: 0 0; transition-delay: 0.45s; }

        /* --- loader --- */
        #loader {
            position: fixed;
            inset: 0;
            z-index: 10;
            background: #0d0118;
            display: grid;
            place-items: center;
            cursor: pointer;
            transition: opacity 0.7s ease;
        }

        #loader.done {
            opacity: 0;
            pointer-events: none;
        }

        .loader-inner {
            width: min(68vw, 340px);
            text-align: center;
        }

        .loader-title {
            font-size: 1.5rem;
            letter-spacing: 0.25em;
            opacity: 0.9;
            margin-bottom: 1.6em;
        }

        .bar {
            display: flex;
            gap: 4px;
            height: 18px;
        }

        .seg {
            flex: 1;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .seg.on {
            background: var(--teal);
            border-color: transparent;
            box-shadow: 0 0 8px rgba(46, 230, 168, 0.8);
        }

        .pct {
            margin-top: 1.3em;
            font-size: 1.05rem;
            letter-spacing: 0.12em;
            color: var(--teal);
        }

        @media (prefers-reduced-motion: reduce) {
            .cursor { animation: none; }
            .hero h1, .gh { transition: none; }
            #loader { transition: none; }
        }
    </style>
    <noscript>
        <style>
            #loader { display: none; }
            .hero h1, .gh { opacity: 1; translate: none; }
        </style>
    </noscript>
</head>
<body>

<div id="loader" role="status" aria-label="Loading">
    <div class="loader-inner">
        <div class="loader-title">releese</div>
        <div class="bar" id="bar"></div>
        <div class="pct" id="pct">0%</div>
    </div>
</div>

<div class="bg"></div>
<div class="vignette"></div>

<main class="hero">
    <h1>releese<span class="cursor"></span></h1>
</main>

<a class="gh" href="https://github.com/releese" rel="me">
    <svg viewBox="0 0 512 512" aria-hidden="true"><path d="M256,5.3C114.6,5.3,0,120.4,0,262.4c0,113.5,73.3,209.9,175.1,243.9c12.8,2.4,17.5-5.6,17.5-12.4c0-6.1-0.2-22.3-0.4-43.7C121,465.6,106,415.7,106,415.7c-11.6-29.7-28.4-37.6-28.4-37.6c-23.3-15.9,1.7-15.6,1.7-15.6c25.7,1.8,39.2,26.5,39.2,26.5c22.8,39.3,59.9,27.9,74.5,21.3c2.3-16.6,8.9-27.9,16.3-34.4c-56.8-6.5-116.6-28.5-116.6-127c0-28.1,10-51,26.4-69c-2.7-6.5-11.4-32.6,2.5-68c0,0,21.5-6.9,70.4,26.3c20.4-5.7,42.3-8.5,64.1-8.6c21.7,0.1,43.6,2.9,64.1,8.7C369,105,390.5,112,390.5,112c14,35.4,5.2,61.5,2.6,68c16.4,18,26.3,40.9,26.3,69c0,98.7-59.8,120.4-116.9,126.8c9.2,7.9,17.4,23.6,17.4,47.6c0,34.4-0.3,62.1-0.3,70.5c0,6.9,4.6,14.9,17.6,12.4C438.7,472.1,512,375.9,512,262.4C512,120.4,397.4,5.3,256,5.3z"/></svg>
    <span>github</span>
</a>

<script>
    (function () {
        var loader = document.getElementById('loader');
        var bar = document.getElementById('bar');
        var pct = document.getElementById('pct');
        var SEGS = 24;
        var segs = [];

        for (var i = 0; i < SEGS; i++) {
            var s = document.createElement('div');
            s.className = 'seg';
            bar.appendChild(s);
            segs.push(s);
        }

        function finish() {
            loader.classList.add('done');
            document.body.classList.add('loaded');
            setTimeout(function () { loader.remove(); }, 900);
        }

        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
            loader.remove();
            document.body.classList.add('loaded');
            return;
        }

        var p = 0;
        var skipped = false;

        function render(value) {
            pct.textContent = value + '%';
            var lit = Math.round(value / 100 * SEGS);
            for (var i = 0; i < SEGS; i++) {
                segs[i].classList.toggle('on', i < lit);
            }
        }

        function tick() {
            if (skipped) return;
            p = Math.min(100, p + 3 + Math.random() * 13);
            render(Math.floor(p));
            if (p < 100) {
                setTimeout(tick, 80 + Math.random() * 150);
            } else {
                render(100);
                setTimeout(finish, 400);
            }
        }

        function skip() {
            if (skipped || loader.classList.contains('done')) return;
            skipped = true;
            render(100);
            finish();
        }

        loader.addEventListener('pointerdown', skip);
        window.addEventListener('keydown', skip);

        if (document.readyState === 'complete') {
            tick();
        } else {
            window.addEventListener('load', tick);
            setTimeout(tick, 2500); /* never hang on a slow asset */
        }
    })();
</script>

</body>
</html>
